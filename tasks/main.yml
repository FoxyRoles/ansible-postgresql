---

- name: Remove the legacy PostgreSQL repository file
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/pgdg.list
    state: absent
  register: postgresql_legacy_repository

- name: Install PostgreSQL repository dependencies
  ansible.builtin.apt:
    name:
      - ca-certificates
      - python3-debian
    state: present
    cache_valid_time: 3600

- name: Configure the PostgreSQL APT repository
  ansible.builtin.deb822_repository:
    name: pgdg
    uris: https://apt.postgresql.org/pub/repos/apt/
    suites: "{{ ansible_facts['distribution_release'] }}-pgdg"
    components: main
    signed_by: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    state: present
  register: postgresql_repository

- name: Refresh the APT cache after PostgreSQL repository changes
  ansible.builtin.apt:
    update_cache: true
  when: postgresql_legacy_repository is changed or postgresql_repository is changed

- name: postgresql is installed
  ansible.builtin.apt:
    pkg: postgresql-{{ postgresql_version }}
    state: present

- name: postgresql is running
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: yes
