---

- name: postgresql apt key present
  get_url:
    url: https://www.postgresql.org/media/keys/ACCC4CF8.asc
    dest: /usr/share/keyrings/pgdg.asc
    mode: '0644'
    force: true

- name: postgresql apt list present
  apt_repository:
    repo: "deb [ signed-by=/usr/share/keyrings/pgdg.asc ] http://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main"
    filename: pgdg
    state: present
    update_cache: true

- name: postgresql is installed
  apt:
    pkg: postgresql-{{ postgresql_version }}
    state: present

- name: postgresql is running
  service:
    name: postgresql
    state: started
    enabled: yes
